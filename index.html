<style>
:root{--bg:#f4f7fb;--ink:#14243a;--muted:#6d7c90;--nav:#102338;--blue:#1764d8;--line:#dbe4ef;--white:#fff;--green:#137b56;--red:#be3d46;--gold:#ac6d0c;--radius:15px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}header{background:var(--nav);color:#fff;padding:19px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header .brand{font-size:21px;font-weight:800;letter-spacing:.2px}.sub{font-size:12px;color:#bdd0df}.userctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input,textarea{background:#fff;border:1px solid #c9d6e5;border-radius:9px;padding:10px 12px;width:100%;outline:none;color:var(--ink)}select:focus,input:focus,textarea:focus{border-color:#5196f5;box-shadow:0 0 0 3px #5196f522}header select{width:auto;min-width:175px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 77px)}aside{background:white;border-right:1px solid var(--line);padding:20px 12px}.navbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 15px;margin:4px 0;border:0;background:transparent;border-radius:10px;color:#506277;font-weight:650}.navbtn.active,.navbtn:hover{background:#e9f1ff;color:#1459bc}main{padding:25px;min-width:0;max-width:1550px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:21px}h1{font-size:25px;margin:0 0 3px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}p{margin:4px 0}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:none;border-radius:9px;padding:10px 15px;font-weight:700;background:#e8eff9;color:#1c426d}.btn.primary{background:var(--blue);color:#fff}.btn.positive{background:var(--green);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.outline{border:1px solid var(--line);background:white}.btn:hover{filter:brightness(.96)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);box-shadow:0 2px 12px #18385608;border-radius:var(--radius)}.stat{padding:18px}.stat .num{font-size:29px;font-weight:800;margin-top:8px}.stat .lbl{color:var(--muted);font-weight:600}.panel{padding:20px;margin-bottom:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:290px}.toolbar select{max-width:215px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th,td{padding:13px 12px;border-bottom:1px solid #edf1f6;vertical-align:middle}th{font-size:12px;text-transform:uppercase;color:#718399;letter-spacing:.5px;background:#fafcff}tr:last-child td{border-bottom:0}tr:hover td{background:#fafcff}.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;background:#e7effc;color:#235ead}.badge.wait{background:#fff1d7;color:#946114}.badge.ok{background:#e0f5ec;color:#11734c}.badge.no{background:#fce8e9;color:#b22d38}.badge.edit{background:#e8ebf1;color:#596b7b}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px;color:#42556d}.field small{color:var(--muted)}.full{grid-column:1/-1}.items-head,.itemrow{display:grid;grid-template-columns:minmax(170px,2fr) 65px minmax(100px,1fr) minmax(115px,1fr) minmax(150px,1.1fr) 42px;gap:9px;align-items:center;margin-bottom:9px}.items-head{font-size:12px;font-weight:700;color:var(--muted)}.itemrow .remove{border:0;background:#fee9ea;color:#bc3747;border-radius:8px;height:39px;font-weight:800}.right{text-align:right}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.total{font-size:21px;font-weight:850}.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0}.step{border:1px solid var(--line);border-radius:10px;padding:11px;background:#f9fbfd;position:relative}.step strong{display:block}.step.done{border-color:#9bdac4;background:#eaf9f2}.step.current{border-color:#eaca83;background:#fff9e9}.step.rejected{border-color:#efadb2;background:#fff0f0}.detailmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.detailmeta div{background:#f8fafc;border:1px solid #e7edf4;padding:11px;border-radius:10px}.detailmeta b{display:block}.history{border-left:2px solid #d9e6f6;margin-left:7px;padding-left:18px}.event{position:relative;padding-bottom:14px}.event:before{content:'';position:absolute;top:5px;left:-24px;width:10px;height:10px;border:2px solid white;border-radius:50%;background:#4b86de;box-shadow:0 0 0 1px #b4c9e7}.notice{background:#fff8df;color:#815400;border:1px solid #e8d49a;border-radius:10px;padding:12px 15px;margin-bottom:18px}.hide{display:none!important}.empty{text-align:center;padding:45px 18px;color:var(--muted)}.separator{height:1px;background:var(--line);margin:20px 0}textarea{min-height:80px;resize:vertical}.modal{position:fixed;inset:0;background:#0c1b33a8;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal>article{width:min(500px,100%);background:white;border-radius:16px;padding:22px;box-shadow:0 20px 65px #0003}.modal footer{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.pill{border-radius:8px;background:#e8f2fd;padding:3px 9px;color:#21569b;font-weight:700;font-size:12px}.attachment{word-break:break-all}.code{font-variant-numeric:tabular-nums}.print-only{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:flex;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);border-right:none}.navbtn{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.timeline{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:14px}header{padding:15px}.grid2,.detailmeta{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.items-head{display:none}.itemrow{grid-template-columns:1fr 1fr}.itemrow input:first-child{grid-column:1/-1}.itemrow .remove{grid-column:1/-1}.itemrow .itemdate{grid-column:1/-1}.toolbar input,.toolbar select{max-width:none}.timeline{grid-template-columns:1fr}}@media print{header,aside,.no-print,.toolbar,.modal,.btn{display:none!important}.layout{display:block}main{padding:0}.panel{border:0;box-shadow:none;padding:8px}body{background:white}h1{font-size:18px}.print-only{display:block}.timeline{break-inside:avoid}}

[hidden]{display:none!important}
/* Tampilan login */
.login-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 12%,#254d78 0%,transparent 35%),linear-gradient(140deg,#0b1c2e,#122e49 60%,#173b5e);overflow:auto}
.login-screen[hidden]{display:none!important}
.login-card{background:#fff;border-radius:22px;padding:38px;width:min(100%,440px);box-shadow:0 24px 80px #0005;text-align:center}
.login-mark{width:56px;height:56px;border-radius:16px;background:#e9f1ff;display:grid;place-items:center;font-size:30px;color:#185bb0;margin:0 auto 8px}
.login-brand{font-size:22px;font-weight:900;letter-spacing:1.8px;color:#142943}.login-subtitle{font-size:12px;color:#708196;margin:0 0 22px}
.login-card h1{font-size:24px;margin-bottom:6px}.login-card>.muted{margin-bottom:26px}
.login-card .field{text-align:left;display:block;margin-top:16px}.login-card .field>span{display:block;font-size:13px;font-weight:750;margin-bottom:6px}
.password-wrap{position:relative}.password-wrap input{padding-right:76px}.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#edf2f9;border-radius:7px;padding:6px 10px;color:#244263;font-weight:700}
.login-error{min-height:20px;color:#b52d3b;font-size:12px;text-align:left;margin:10px 0 2px}.login-submit{width:100%;margin-top:8px;padding:13px}.login-foot{border-top:1px solid #e7edf5;padding-top:18px;margin-top:24px;color:#8291a3;font-size:11px}
@media(max-width:480px){.login-card{padding:28px 22px}.login-card h1{font-size:22px}}
@media print{#loginScreen{display:none!important}}

.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.admin-tabs button.active{background:#1764d8;color:#fff}.person-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0}.person-card .person-body{flex:1;min-width:170px}.sig-preview{height:65px;max-width:180px;object-fit:contain;border:1px dashed #c8d6e5;border-radius:8px;background:#fff;padding:5px}.sig-empty{height:65px;min-width:140px;border:1px dashed #c8d6e5;border-radius:8px;display:grid;place-items:center;color:#8897a7;font-size:12px}.signature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.signature-box{border:1px solid #dbe4ef;border-radius:9px;padding:12px;text-align:center;min-height:165px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}.signature-box img{max-height:58px;max-width:100%;object-fit:contain}.signature-box .sig-gap{height:58px}.signature-box b{font-size:12px}.signature-box span{font-size:11px;color:#6d7c90}.admin-note{padding:10px 12px;background:#f0f5fc;border-radius:9px;color:#4c617a;font-size:12px;margin:12px 0}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:auto}.admin-section{margin-top:14px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* v3 — Responsive mobile layout: prevent the horizontal navigation from
   stretching vertically when the list view has little/no content. */
html{max-width:100%;overflow-x:clip}
body{max-width:100%;overflow-x:clip}
@media (max-width:1000px){
  .layout{display:block;min-height:0;width:100%}
  .layout>aside{display:flex;flex-direction:row;align-items:center;align-content:center;
    justify-content:flex-start;flex-wrap:nowrap;align-self:start;height:auto;min-height:0;
    max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 10px;
    border-right:0;border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .layout>aside>.navbtn{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;
    width:auto;min-height:42px;height:auto;max-height:52px;margin:0 3px;
    padding:10px 12px;line-height:1.35;white-space:nowrap}
  .layout>main{display:block;width:100%;max-width:100%;min-width:0}
}
@media (max-width:650px){
  header{padding:14px 15px;gap:10px}
  header .brand{font-size:clamp(16px,4.3vw,20px);line-height:1.35;overflow-wrap:anywhere}
  .userctrl{gap:8px}
  .layout>aside{padding:7px 9px}

  main{padding:16px 12px}

  .topbar{align-items:flex-start;gap:12px;margin-bottom:16px}
  .topbar>.btn{max-width:100%}
  .toolbar{align-items:stretch;gap:10px}
  .toolbar input,.toolbar select{max-width:none;width:100%;min-width:0}
  .toolbar .btn{min-height:42px;align-self:flex-start}
  .scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}

function obtainStorage(kind){
  try {
    const target=window[kind], test='__twa_preview_check__';
    target.setItem(test,'1');target.removeItem(test);
    return target;

    const cache=new Map();

      setItem:(key,value)=>cache.set(key,String(value)),
      removeItem:key=>cache.delete(key),clear:()=>cache.clear()};
  }
}

// All user-facing dates use DD Mon YYYY (e.g. 10 Oct 2026).
// A date-only ISO string is parsed as a calendar date, not as a UTC timestamp,
// to prevent the date shifting when opened in another timezone.
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function date(value,showTime=false){
  if(!value)return '—';
  const raw=String(value);
  const plain=/^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
  if(plain){const y=Number(plain[1]),m=Number(plain[2]),d=Number(plain[3]);const valid=new Date(y,m-1,d);return m>=1&&m<=12&&valid.getFullYear()===y&&valid.getMonth()===m-1&&valid.getDate()===d?`${String(d).padStart(2,'0')} ${MONTHS[m-1]} ${y}`:'—'}
  const parsed=new Date(raw);
  if(Number.isNaN(parsed.getTime()))return '—';
  const result=`${String(parsed.getDate()).padStart(2,'0')} ${MONTHS[parsed.getMonth()]} ${parsed.getFullYear()}`;
  return showTime?`${result}, ${String(parsed.getHours()).padStart(2,'0')}:${String(parsed.getMinutes()).padStart(2,'0')}`:result;
}
const MONTHS_FULL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function dateFull(value){
  if(!value)return '—';
  const raw=String(value),match=/^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
  let y,m,d;
  if(match){y=Number(match[1]);m=Number(match[2]);d=Number(match[3]);}
  else {const v=new Date(value);if(Number.isNaN(v.getTime()))return '—';y=v.getFullYear();m=v.getMonth()+1;d=v.getDate();}
  const check=new Date(y,m-1,d);
  return m>=1&&m<=12&&check.getFullYear()===y&&check.getMonth()===m-1&&check.getDate()===d?`${d} ${MONTHS_FULL[m-1]} ${y}`:'—';
}
function localToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateFromTimestamp(v){if(!v)return localToday();const d=new Date(v);if(Number.isNaN(d.getTime()))return localToday();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function neededRangeText(start,end){

 const a=/^(\d{4})-(\d{2})-(\d{2})$/.exec(start),b=/^(\d{4})-(\d{2})-(\d{2})$/.exec(end);

}

function auditRole(h){
  const stage=String(h?.stage||'').toLowerCase();
  const actor=String(h?.by||'').toLowerCase();
  if(stage==='kepala'||actor.includes('kepala')||actor.includes('operation manager'))return 'Kepala Bagian';
  if(stage==='finance'||actor.includes('finance'))return 'Finance';
  if(stage==='direktur'||actor.includes('direktur'))return 'Direktur';
  return 'Pemohon';
}
function auditLabel(h){
  const action=String(h?.action||'').trim().toLowerCase();
  const actor=auditRole(h);
  if(['tolak','ditolak','reject','rejected'].includes(action))return 'Ditolak oleh '+actor;
  if(['minta revisi','perlu revisi','revisi diminta','request revision'].includes(action))return 'Revisi Diminta oleh '+actor;
  if(action.includes('diperbaiki')||action.includes('dikirim ulang'))return 'Pengajuan Diperbaiki & Diajukan Kembali';
  if(action.includes('dibuat')||action==='diajukan')return 'Pengajuan Diajukan';
  if(action.includes('verifikasi')||action.includes('verified'))return 'Terverifikasi oleh Finance';
  if(['setujui','disetujui','approved','approve'].includes(action))return 'Approved oleh '+actor;
  return String(h?.action||'Aktivitas Tercatat');
}
function auditTone(h){
  const action=String(h?.action||'').toLowerCase();
  if(['tolak','ditolak','reject','rejected'].includes(action))return 'audit-rejected';
  if(action.includes('revisi'))return 'audit-revision';
  if(action.includes('setujui')||action.includes('verifikasi')||action.includes('approved'))return 'audit-approved';
  return 'audit-submitted';
}

function bindList(){document.getElementById('q').oninput=e=>{search=e.target.value;document.getElementById('listing').innerHTML=table(filtered())};document.getElementById('filter').onchange=e=>{filter=e.target.value;document.getElementById('listing').innerHTML=table(filtered())}}
function formPage(){const d=editing?load().find(x=>x.id===editing&&ownsRequest(x)&&canAccessRequest(x)):copyingRequestId?load().find(x=>x.id===copyingRequestId&&canAccessRequest(x)):null;return header(editing?(d?.status==='kepala'?'Edit Pengajuan (Belum Disetujui Kepala Bagian)':'Revisi Pengajuan'):copyingRequestId?'Salin Pengajuan Dana':'Form Pengajuan Dana','Isi tanggal pengajuan dan tanggal kebutuhan dana untuk setiap rincian biaya.')+`<form id="requestForm"><section class="panel"><h2>Informasi Pengajuan</h2><div class="grid2"><div class="field"><label>Nama Pemohon *</label>${personSelect('pemohon',d?.requesterPerson?.id||chosenPerson('pemohon')?.id||'','requesterPerson')}</div><div class="field"><label>Divisi / Bagian *</label><select id="requestDepartment" name="department" required onchange="headRoutingPreview()">${['',...new Set([...DEPARTMENTS,...roster().pemohon.map(personDepartment).filter(Boolean),d?.department||''].filter((v,i)=>v||i===0))].map(v=>`<option value="${escapeHtml(v)}" ${d?.department===v?'selected':''}>${escapeHtml(v||'— Pilih Divisi / Bagian —')}</option>`).join('')}</select><small>Otomatis mengikuti Divisi / Bagian yang ditetapkan Admin untuk Nama Pemohon.</small><div id="headRoutingPreview" class="head-routing" aria-live="polite"></div></div><div class="field full"><label>Judul / Keperluan Dana *</label><input name="title" required maxlength="180" placeholder="Contoh: Pembelian alat pendukung operasional" value="${escapeHtml(d?.title||'')}"></div><div class="field"><label>Tanggal Pengajuan *</label><div class="date-picker-row"><input id="requestDateDisplay" type="text" readonly onclick="openRequestDatePicker()" aria-label="Tanggal pengajuan (contoh 23 November 2026)" placeholder="23 November 2026"><button class="btn outline date-picker-btn" type="button" onclick="openRequestDatePicker()" aria-label="Pilih tanggal pengajuan" title="Pilih tanggal">📅</button><input class="date-picker-native" id="requestDatePicker" type="date" name="requestDate" required value="${escapeHtml(d?.requestDate||dateFromTimestamp(d?.created))}" onchange="syncRequestDate()" aria-label="Pilih tanggal pengajuan melalui kalender"></div></div><div class="field"><label>Mata Uang per Rincian</label><div class="notice" style="margin:0;padding:10px 12px">Pilih mata uang pada setiap baris Rincian Biaya (IDR, USD, SGD, dan lainnya). Total otomatis dipisahkan per mata uang tanpa konversi kurs.</div></div><div class="field"><label>Kategori</label><select name="category">${['Operasional','Maintenance','Training','Transportasi','Akomodasi','Pengadaan','Lainnya'].map(v=>`<option ${d?.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Penjelasan / Justifikasi *</label><textarea name="reason" required placeholder="Jelaskan kebutuhan, manfaat, lokasi, dan urgensi">${escapeHtml(d?.reason||'')}</textarea></div></div></section><section class="panel"><div class="flex space"><h2>Rincian Biaya</h2><button class="btn outline" type="button" onclick="addItem()">＋ Tambah Item</button></div><div class="items-head"><span>Uraian *</span><span>Qty *</span><span>Harga Satuan *</span><span>Mata Uang *</span><span>Jumlah</span><span>Tanggal Dibutuhkan *</span><span></span></div><div id="items"></div><div class="separator"></div><div class="flex space"><span class="muted">Total pengajuan per mata uang <div class="multi-currency-hint">Tanpa konversi kurs</div></span><div class="total currency-total-box" id="grand">Rp 0</div></div></section><section class="panel"><h2>Dokumen Pendukung</h2><div class="field"><label>Upload Lampiran (opsional, max 5 MB)</label><input id="upload" type="file" accept=".pdf,.jpg,.jpeg,.png"><small>Lampiran diunggah ke Firebase Storage. Pastikan Storage Rules telah dipasang. ${d?.attachment?`Lampiran tersimpan: ${escapeHtml(d.attachment.name)}.`:''}</small></div></section><div class="flex no-print"><button class="btn primary" type="submit">${d?'Kirim Ulang Revisi':'Ajukan untuk Persetujuan'} function addItem(item={name:'',qty:1,price:0,needed:'',currency:'IDR'}){
 const el=document.createElement('div');el.className='itemrow';
 const selectedDate=item.needed||'';const selectedEnd=item.neededEnd||'';
 const selectedCurrency=itemCurrency(item,{currency:item.currency||'IDR'});
 el.innerHTML=`<input class="itname" placeholder="Nama barang / biaya" required maxlength="180" value="${escapeHtml(item.name)}"><input class="itqty" type="number" min="0.01" step="0.01" required value="${Number(item.qty)||1}"><input class="itprice" type="number" min="0" step="${selectedCurrency==='IDR'||selectedCurrency==='JPY'?'1':'0.01'}" required value="${Number(item.price)||0}"><select class="itcurrency currency-choice" required aria-label="Mata uang rincian">${Object.entries(CURRENCIES).map(([code,label])=>`<option value="${code}" ${selectedCurrency===code?'selected':''}>${code}</option>`).join('')}</select><input class="itsum" readonly aria-label="Jumlah item"><div class="itemdate"><label class="itemdate-label">Tanggal Dibutuhkan *</label><input class="itneeded-display" type="text" readonly value="${selectedDate?escapeHtml(neededRangeText(selectedDate,selectedEnd)):String()}" placeholder="Pilih tanggal / rentang" onclick="openItemDate(this)" aria-label="Tanggal dibutuhkan"><div class="needed-date-inputs"><label>Mulai<input class="itneeded" type="date" required value="${escapeHtml(selectedDate)}" onchange="syncItemDate(this)" aria-label="Tanggal mulai dibutuhkan"></label><label>Sampai (opsional)<input class="itneeded-end" type="date" min="${escapeHtml(selectedDate)}" value="${escapeHtml(selectedEnd)}" onchange="syncItemDate(this)" aria-label="Tanggal akhir dibutuhkan"></label></div></div><button type="button" class="remove" aria-label="Hapus item" title="Hapus item">×</button>`;
 el.querySelector('.remove').onclick=()=>{el.remove();calc()};
 // Ketika Harga Satuan masih 0, kosongkan saat disentuh agar nominal langsung dapat diketik.
 const unitPrice=el.querySelector('.itprice');
 unitPrice.addEventListener('focus',()=>{
  if(Number(unitPrice.value)===0){unitPrice.value='';calc();}
 });
 // Jika dibiarkan kosong, kembalikan ke nilai awal agar tidak ada kolom kosong.
 unitPrice.addEventListener('blur',()=>{
  if(unitPrice.value.trim()===''){unitPrice.value='0';calc();}
 });
 el.querySelectorAll('.itqty,.itprice').forEach(x=>x.addEventListener('input',calc));
 el.querySelector('.itcurrency').addEventListener('change',()=>{
  const c=el.querySelector('.itcurrency').value;
  el.querySelector('.itprice').step=(c==='IDR'||c==='JPY')?'1':'0.01';
  calc();
 });
 el.querySelector('.itneeded').addEventListener('change',()=>{el.querySelector('.itneeded-end').min=el.querySelector('.itneeded').value;});document.getElementById('items').prepend(el);calc();
}
function calc(){
 const groups={};
 document.querySelectorAll('.itemrow').forEach(r=>{
  const c=r.querySelector('.itcurrency').value;
  const n=(Number(r.querySelector('.itqty').value)||0)*(Number(r.querySelector('.itprice').value)||0);
  r.querySelector('.itsum').value=money(n,c);
  groups[c]=(groups[c]||0)+n;
 });
 const el=document.getElementById('grand');
 if(el)el.innerHTML=Object.entries(groups).map(([c,n])=>`<div class="currency-stat-line">${money(n,c)}</div>`).join('')||'<div class="currency-stat-line">Rp 0</div>';
}

if(editing&&!old){alert('Anda tidak berwenang mengubah pengajuan ini.');return}if(!old&&!divisionCode(effectiveDepartment)){alert('Kode penomoran divisi '+effectiveDepartment+' belum diatur. Minta Admin membuka Master Data → Penomoran Divisi.');return}
storage.setItem(selectedPersonKey('pemohon'),requesterPerson.id);let att=old?.attachment||null;const file=document.getElementById('upload').files[0];if(file){if(file.size>5*1024*1024){alert('Lampiran maksimal 5 MB.');return}try{att=await window.twaCloud.uploadAttachment(file,effectiveDepartment)}catch(err){alert('Upload lampiran gagal: '+err.message);return}}const now=new Date().toISOString();const obj={...(old||{}),id:old?.id||'',created:old?.created||now,updated:now,requester:requesterPerson.name,requesterPerson:snapshot(requesterPerson),ownerUsername:loginUsername,ownerUid:cloudUid,department:effectiveDepartment,headId:targetHead.id,headPerson:snapshot(targetHead),title:String(fd.get('title')).trim(),requestDate:String(fd.get('requestDate')),category:String(fd.get('category')),reason:String(fd.get('reason')).trim(),items,currency:items[0]?.currency||'IDR',attachment:att,status:'kepala',history:[...(old?.history||[]),{at:now,by:roleName[role],name:currentName(),action:old?(old.status==='kepala'?'Pengajuan diedit sebelum persetujuan Kepala Bagian':'Pengajuan diperbaiki & dikirim ulang'):'Pengajuan dibuat & diajukan',note:''}]};

}catch(err){

   const num=`${String(next).padStart(2,'0')}/${number.prefix||'IOM-FR'}/${code}/${romans[month-1]}/${year}`;
   const request={...input,id:num,ownerUid:u.uid,departmentKey:currentDeptKey(),status:'kepala'};
   // Jangan membaca dokumen pengajuan baru sebelum create: aturan divisi
   // memang melarang pembacaan dokumen yang belum ada (permission-denied).
   // Jika nomor sudah terpakai, operasi set akan diperlakukan sebagai UPDATE,
   // yang ditolak oleh Firestore Rules untuk pengajuan biasa.
   const target=reqRef(num);
   t.set(counter,{last:next,departmentKey:currentDeptKey(),year,code});
   t.set(target,request);
   const event=doc(collection(reqRef(num),'audit'));
   t.set(event,{actorUid:u.uid,actorRole:'pemohon',at:new Date().toISOString(),action:'Pengajuan Diajukan',status:'kepala'});
   return num;
  });return id;
 },
 async updateRequest(input){
  const u=requireUser();if(profile.role!=='pemohon')throw Error('Khusus Pemohon');
  await runTransaction(db,async t=>{
   const ref=reqRef(input.id),old=await t.get(ref);
   if(!old.exists()||!['revision','kepala'].includes(old.data().status)||old.data().ownerUid!==u.uid)throw Error('Pengajuan tidak dapat diedit karena sudah diproses atau bukan milik Anda');
   const safe={...input,id:old.data().id,ownerUid:u.uid,department:old.data().department,departmentKey:old.data().departmentKey,status:'kepala'};
   t.update(ref,safe);t.set(doc(collection(ref,'audit')),{actorUid:u.uid,actorRole:'pemohon',at:new Date().toISOString(),action:old.data().status==='kepala'?'Edit Sebelum Persetujuan Kepala Bagian':'Revisi Dikirim Ulang',status:'kepala'});
  });return input.id;
 },
 async decide(input,oldStage){
  const u=requireUser();if(profile.role!==oldStage)throw Error('Tahap persetujuan tidak sesuai.');
  const ref=reqRef(input.id);
  await runTransaction(db,async t=>{
   const old=await t.get(ref);if(!old.exists()||old.data().status!==oldStage)throw Error('Status pengajuan sudah berubah. Refresh data.');
   if(profile.role==='kepala'&&old.data().departmentKey!==currentDeptKey())throw Error('Divisi berbeda.');
   const last=input.history[input.history.length-1];
   const updated={status:input.status,updated:input.updated,history:[...(old.data().history||[]),last]};
   if(input.rejectedAt)updated.rejectedAt=input.rejectedAt;
   t.update(ref,updated);
   t.set(doc(collection(ref,'audit')),{actorUid:u.uid,actorRole:profile.role,at:input.updated,action:last.action,note:last.note||'',from:oldStage,status:input.status});
  });
 },
 async deleteRequest(input,reason){const u=requireUser();if(profile.role!=='admin')throw Error('Khusus Admin');
  const ref=reqRef(input.id),archive=doc(db,'fundDeletedRequests',encodeURIComponent(input.id)),batch=writeBatch(db);
  batch.set(archive,{...input,deletedAt:new Date().toISOString(),deletedBy:profile.username,deletedByUid:u.uid,deleteReason:reason});batch.delete(ref);await batch.commit();
 },
 async manageUser(input){requireUser();if(profile.role!=='admin')throw Error('Khusus Admin');
  try{
   const result=await httpsCallable(functions,'manageFundUser')(input);
   return result.data;
  }catch(err){
   console.error('manageFundUser gagal:',{code:err.code,message:err.message,details:err.details});
   throw err;
  }
 },
 async importBackup(data){requireUser();if(profile.role!=='admin')throw Error('Khusus Admin');
  if(!Array.isArray(data.requests))throw Error('Backup tidak valid');
  for(let i=0;i<data.requests.length;i+=200){const batch=writeBatch(db);
   for(const item of data.requests.slice(i,i+200)){
    if(!item.id||!item.department)continue;
    const userProfile=Object.values(window.twaCloudProfiles?.()||{}).find(p=>p.username===item.ownerUsername);
    const dept=String(item.department).trim().toLowerCase();
    batch.set(reqRef(item.id),{...item,departmentKey:dept,ownerUid:item.ownerUid||userProfile?.uid||''});
   }await batch.commit();
  }
  const maxima=new Map();
  for(const item of [...data.requests,...(Array.isArray(data.deletedRequests)?data.deletedRequests:[])]){
   const parts=String(item.id||'').split('/');if(parts.length!==5)continue;
   const seq=Number(parts[0]),year=Number(parts[4]),code=parts[2];
   if(!Number.isInteger(seq)||seq<1||!Number.isInteger(year)||!code)continue;
   const key=`${year}_${code}`;
   const prev=maxima.get(key);if(!prev||seq>prev.last)maxima.set(key,{last:seq,year,code,departmentKey:String(item.department||'').toLowerCase()});
  }
  for(const [key,value] of maxima){const counter=doc(db,'fundCounters',key);await runTransaction(db,async t=>{
   const snap=await t.get(counter);if(!snap.exists()||Number(snap.data().last)<value.last)t.set(counter,value);
  })}
  if(data.people)await bridge.saveMaster('roster',data.people);
  if(data.numbering)await bridge.saveMaster('numbering',data.numbering);
  if(data.settings)await bridge.saveMaster('settings',data.settings);
 }
};
window.twaCloud=bridge;
// Profile data is provided by the authenticated classic application state.
window.twaCloudError?.('');

</script>
