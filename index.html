<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transwisata Leave System</title>
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/14XvFbNETCuybdeUeH6BPrPaC33uBijMc">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/14XvFbNETCuybdeUeH6BPrPaC33uBijMc">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Transwisata Leave System","short_name":"TWA Leave","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#1e3a8a","icons":[{"src":"https://lh3.googleusercontent.com/d/14XvFbNETCuybdeUeH6BPrPaC33uBijMc","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .aviation-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        #mobile-nav-overlay { transition: opacity 0.3s ease, visibility 0.3s ease; }
        #mobile-nav-content { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spin-sync { animation: spin 1s linear infinite; }
        #global-loader { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, visibility 0.4s; visibility: visible; }
        .loader-hidden { transform: translateY(150px) !important; opacity: 0 !important; visibility: hidden !important; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 40px; background: white; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- STATUS SYNC -->
    <div id="global-loader" class="fixed bottom-6 right-6 z-[300] bg-white/90 backdrop-blur-md px-5 py-4 rounded-[1.5rem] shadow-2xl border border-blue-100 flex items-center gap-4 animate-fade-in">
        <div class="loader w-6 h-6 border-2 border-slate-100 border-top-blue-600"></div>
        <div>
            <p class="font-black text-blue-900 uppercase tracking-widest text-[9px]">Status Sinkronisasi</p>
            <p id="sync-status-text" class="text-[11px] font-bold text-slate-500">Menghubungkan ke Database...</p>
        </div>
    </div>

    <!-- LOGIN PAGE -->
    <div id="login-page" class="fixed inset-0 z-[100] aviation-gradient flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl max-w-md w-full overflow-hidden animate-fade-in">
            <div class="p-10">
                <div class="flex items-center gap-4 mb-8 justify-center">
                    <div class="h-16 w-auto"><img src="https://lh3.googleusercontent.com/d/14XvFbNETCuybdeUeH6BPrPaC33uBijMc" alt="Logo" class="h-full object-contain" /></div>
                    <div class="text-left"><h1 class="text-xs font-black tracking-[0.2em] uppercase text-blue-900 opacity-60">Transwisata</h1><p class="text-xl font-black leading-tight text-blue-900">Prima Aviation</p></div>
                </div>
                <div class="space-y-6">
                    <div class="text-center"><h2 class="text-xl font-bold text-slate-800">ECrew Leaves System</h2><p class="text-xs text-slate-500 mt-1">Portal Manajemen Cuti Internal</p></div>
                    <form id="login-form" class="space-y-4">
                        <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Username</label><div class="relative"><i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i><input type="text" id="username" placeholder="Username" required class="w-full pl-11 pr-4 py-3.5 rounded-2xl border border-slate-100 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-100 outline-none transition-all font-medium text-sm"></div></div>
                        <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label><div class="relative"><i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i><input type="password" id="password" placeholder="••••••••" required class="w-full pl-11 pr-4 py-3.5 rounded-2xl border border-slate-100 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-blue-100 outline-none transition-all font-medium text-sm"></div></div>
                        <button type="submit" id="login-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold shadow-xl shadow-blue-200 transition-all active:scale-95">Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-wrapper" class="hidden flex h-screen overflow-hidden">
        <aside class="w-64 aviation-gradient text-white hidden md:flex flex-col shadow-2xl">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="h-10 w-10 shrink-0 bg-white p-1 rounded-lg"><img src="https://lh3.googleusercontent.com/d/14XvFbNETCuybdeUeH6BPrPaC33uBijMc" alt="Logo" class="w-full h-full object-contain" /></div>
                    <div><h1 class="text-[10px] font-bold tracking-widest uppercase opacity-80">Transwisata</h1><p class="text-sm font-black leading-tight text-white">Prima Aviation</p></div>
                </div>
                <nav class="space-y-1" id="dynamic-nav"></nav>
            </div>
            <div class="mt-auto p-6 bg-blue-900/30">
                <div class="flex items-center gap-3 mb-4">
                    <img id="user-avatar" src="" class="w-10 h-10 rounded-full border-2 border-blue-400 shadow-md" alt="User">
                    <div class="overflow-hidden"><p id="user-name" class="text-sm font-bold truncate">Nama User</p><p id="user-role-label" class="text-[10px] uppercase opacity-70 tracking-tighter">Role</p></div>
                </div>
                <button onclick="logout()" class="w-full py-2.5 px-4 rounded-xl bg-red-500/10 hover:bg-red-500/30 text-red-200 text-xs font-bold flex items-center justify-center gap-2 transition-all group">
                    <i class="fas fa-sign-out-alt group-hover:-translate-x-1 transition-transform"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full overflow-y-auto bg-slate-50">
            <header class="bg-white border-b border-slate-200 px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleMobileMenu()" class="md:hidden w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition-all"><i class="fas fa-bars"></i></button>
                    <button id="global-back-btn" onclick="switchTab('dashboard')" class="hidden w-10 h-10 rounded-full hover:bg-slate-100 items-center justify-center text-slate-400 transition-all"><i class="fas fa-arrow-left"></i></button>
                    <div><h2 id="page-title" class="text-lg md:text-xl font-black text-slate-800 uppercase tracking-tight">Dashboard</h2><p id="page-subtitle" class="text-[10px] md:text-xs text-slate-500 font-medium">Panel Manajemen Cuti</p></div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="sync-btn" onclick="manualSync()" class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white flex items-center justify-center transition-all shadow-sm" title="Sync Data"><i class="fas fa-sync-alt" id="sync-icon"></i></button>
                    <div id="current-date" class="hidden lg:block text-xs font-bold text-slate-400 bg-slate-50 px-4 py-2 rounded-full border border-slate-100"></div>
                    <img id="header-user-avatar" src="" class="w-8 h-8 rounded-full border border-blue-100 md:hidden" />
                </div>
            </header>
            <div id="main-content" class="p-4 md:p-8"></div>
        </main>
    </div>

    <!-- MODALS -->
    <div id="modal-note" class="fixed inset-0 z-[200] modal-overlay hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl max-w-md w-full overflow-hidden animate-fade-in">
            <div class="p-6 text-white aviation-gradient"><h3 id="note-title" class="text-lg font-black uppercase tracking-tight">Konfirmasi</h3></div>
            <div class="p-8 space-y-4">
                <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Catatan</label><textarea id="note-text" rows="4" placeholder="..." class="w-full px-4 py-3 rounded-2xl border border-slate-100 bg-slate-50 outline-none font-medium text-sm transition-all"></textarea></div>
                <div class="flex gap-3"><button onclick="closeNoteModal()" class="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold text-xs uppercase">Batal</button><button onclick="confirmApprovalWithNote()" class="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-black text-xs uppercase shadow-lg">Simpan</button></div>
            </div>
        </div>
    </div>

    <div id="modal-detail" class="fixed inset-0 z-[150] modal-overlay hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-fade-in">
            <div id="print-area" class="p-6 md:p-10 overflow-y-auto no-scrollbar flex-1">
                <div class="flex justify-between items-start mb-8 pb-6 border-b border-slate-100">
                    <div class="flex items-center gap-3"><img src="https://lh3.googleusercontent.com/d/14XvFbNETCuybdeUeH6BPrPaC33uBijMc" alt="Logo" class="h-10 md:h-12 object-contain" /><div><h4 class="text-[10px] font-black uppercase text-blue-900 tracking-widest">Transwisata</h4><p class="text-xs md:text-sm font-black text-blue-900">Prima Aviation</p></div></div>
                    <div class="text-right"><h3 class="text-sm md:text-lg font-black text-slate-800 uppercase tracking-tight">Formulir Cuti</h3><p id="detail-id" class="text-[9px] md:text-xs font-bold text-slate-400 tracking-widest mt-1">#TWA-000</p></div>
                </div>
                <div id="modal-body" class="space-y-6"></div>
            </div>
            <div class="p-6 bg-slate-50 border-t border-slate-100 flex gap-4 no-print shrink-0"><button onclick="closeDetail()" class="flex-1 py-4 bg-white border border-slate-200 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 transition-all text-xs">Kembali</button><button onclick="window.print()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 shadow-lg transition-all flex items-center justify-center gap-2 text-xs"><i class="fas fa-print"></i> Cetak PDF</button></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-8 right-8 z-[250] hidden animate-fade-in"><div class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-white/10"><div id="toast-icon" class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-sm"><i class="fas fa-check"></i></div><p id="toast-msg" class="text-sm font-bold">Berhasil</p></div></div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycby6emc8TevvAhAzCzt-aMq3pe2WP34VcLBUU5PQCLUNuHx_C3sB3esubXvyABixUeRk7A/exec";

        const DIVISIONS = ["Operation", "Maintenance", "Safety", "Staf"];
        const POSITIONS = ["Director", "Safety, Quality & Security Manager", "General Manager", "Operation Manager", "Maintenance Manager", "Chief Pilot Fixed Wing", "Chief Pilot Rotary Wing", "Chief Flight Support", "Chief Engineer", "Chief Inspector", "Chief Finance, Accounting & Tax", "Human Resource Development", "Line Pilot", "Engineer", "Cabin Service", "Staf", "Flight Support", "Ground Support", "Finance", "Logistic", "Aviation Security", "Kurir", "Driver"];
        const HEAD_POSITIONS = ["Quality, Safety, Security Manager", "General Manager", "Operation Manager", "Maintenance Manager", "Chief Pilot Rotary Wing", "Chief Pilot Fixed Wing", "Chief Flight Support", "Chief Engineer", "HRD"];

        const SPECIAL_LEAVE_RULES = {
            "Menikah": 3, "Menikahkan anak": 2, "Istri melahirkan / keguguran": 2, "Khitanan anak": 2, "Baptis anak (2 Hari)": 2, "Keluarga serumah meninggal": 2, "Anggota keluarga serumah lain meninggal": 1
        };

        let users = []; let heads = []; let leaveRequests = []; let hrdProfile = { name: 'Admin TWA', division: 'HR', position: 'Manager', email: 'hr@transwisata.com', phone: '628123456789', LastResetYear: '0' };
        const ROLES = { STAFF: 'staff', HEAD: 'head', HRD: 'hrd' };
        let currentUser = null; 
        let pendingApprovalId = null; let isApproveAction = true; let isMobileMenuOpen = false; let isSyncing = false;
        const $ = (id) => document.getElementById(id);

        function toISODateString(val) {
            if (!val) return "";
            if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
            try {
                const date = new Date(val);
                if (isNaN(date.getTime())) return val;
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            } catch (e) { return val; }
        }

        async function fetchFromSheet() {
            try {
                const res = await fetch(GAS_API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'fetchAll' }),
                    redirect: 'follow',
                    mode: 'cors'
                });
                if (!res.ok) throw new Error('Network response was not ok');
                const result = await res.json();
                if (result.status === 'success') {
                    users = result.data.users || []; 
                    heads = result.data.heads || []; 
                    leaveRequests = result.data.requests || [];
                    if(result.data.profile) result.data.profile.forEach(p => hrdProfile[p.Key] = p.Value);
                    if (currentUser && currentUser.data) {
                        const updated = users.find(u => u.ID.toString() === currentUser.data.ID.toString());
                        if (updated) currentUser.data = updated;
                    }
                    await checkAndResetAnnualQuotas();
                    return true;
                }
            } catch (err) { 
                console.error('Fetch error:', err);
                if ($('sync-status-text')) $('sync-status-text').innerText = "Gagal menghubungkan ke Database";
            } 
            return false;
        }

        async function checkAndResetAnnualQuotas() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const lastReset = parseInt(hrdProfile.LastResetYear) || 0;
            if (now.getMonth() === 0 && now.getDate() >= 1 && lastReset < currentYear) {
                for (let u of users) {
                    u.AnnualQuota = 12;
                    u.SpecialQuota = 40;
                    u.id = u.ID;
                    await callGAS('saveUser', u);
                }
                hrdProfile.LastResetYear = currentYear.toString();
                await callGAS('saveProfile', hrdProfile);
                showToast(`Kuota Tahunan Berhasil Di-reset ke ${currentYear}!`, 'success');
            }
        }

        async function manualSync() {
            if(isSyncing) return; isSyncing = true; 
            $('sync-icon').classList.add('spin-sync'); 
            $('sync-btn').classList.add('opacity-50'); 
            $('global-loader').classList.remove('loader-hidden');
            $('sync-status-text').innerText = "Menghubungkan ke Database...";
            const success = await fetchFromSheet();
            setTimeout(() => { 
                $('sync-icon').classList.remove('spin-sync'); 
                $('sync-btn').classList.remove('opacity-50'); 
                $('global-loader').classList.add('loader-hidden'); 
                isSyncing = false; 
                if(success) { 
                    showToast('Database Sinkron!'); 
                    const currentTab = document.querySelector('.nav-item.text-white')?.id.replace('nav-', ''); 
                    if(currentTab) switchTab(currentTab); 
                } else { 
                    showToast('Sync Gagal!', 'error'); 
                } 
            }, 600);
        }

        async function callGAS(action, data = {}) {
            try { 
                const res = await fetch(GAS_API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify({ action, data }),
                    redirect: 'follow'
                }); 
                const result = await res.json();
                return result; 
            } catch (err) { 
                console.error('GAS Error:', err);
                return { status: 'error', message: err.toString() }; 
            }
        }

        async function logout() {
            if (isMobileMenuOpen) toggleMobileMenu();
            $('app-wrapper').classList.add('hidden');
            $('login-page').classList.remove('hidden');
            currentUser = null;
            $('username').value = '';
            $('password').value = '';
        }

        $('login-form').addEventListener('submit', (e) => {
            e.preventDefault(); const u = $('username').value.trim(); const p = $('password').value.trim();
            if (u === 'HRD' && p === 'TWA119-021') { loginAs(ROLES.HRD, 'HR Department'); return; }
            const hMatch = heads.find(h => h.Username === u && h.Password === p); if (hMatch) { loginAs(ROLES.HEAD, hMatch.Name, hMatch); return; }
            const uMatch = users.find(usr => usr.Username === u && usr.Password === p); if (uMatch) loginAs(ROLES.STAFF, uMatch.Name, uMatch); else showToast('Kredensial tidak valid!', 'error');
        });

        function loginAs(role, name, data = null) {
            currentUser = { role, name, data }; $('login-page').classList.add('hidden'); $('app-wrapper').classList.remove('hidden');
            const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1e3a8a&color=fff&bold=true`;
            $('user-name').innerText = name; 
            $('user-role-label').innerText = role === ROLES.STAFF ? (data ? data.Position : 'Staff') : (role === ROLES.HEAD ? data.Position : role.toUpperCase());
            $('user-avatar').src = avatar; 
            setupNavigation(); switchTab('dashboard');
        }

        function setupNavigation() {
            const nav = $('dynamic-nav'); nav.innerHTML = '';
            const menu = [{ id: 'dashboard', label: 'Dashboard', icon: 'th-large', roles: [ROLES.STAFF, ROLES.HEAD, ROLES.HRD] }, { id: 'approval', label: 'Persetujuan', icon: 'check-double', roles: [ROLES.HEAD, ROLES.HRD] }, { id: 'history', label: 'Riwayat', icon: 'history', roles: [ROLES.STAFF, ROLES.HEAD, ROLES.HRD] }];
            menu.forEach(it => { if (it.roles.includes(currentUser.role)) { nav.innerHTML += `<a href="#" onclick="switchTab('${it.id}')" id="nav-${it.id}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-blue-100 hover:bg-blue-800 group"><i class="fas fa-${it.icon} w-5"></i><span>${it.label}</span></a>`; } });
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('bg-blue-700/50', 'border-l-4', 'border-blue-300', 'text-white'));
            const active = $(`nav-${tab}`); if (active) active.classList.add('bg-blue-700/50', 'border-l-4', 'border-blue-300', 'text-white');
            $('page-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            if (tab === 'dashboard') loadDashboard(); else if (tab === 'history') loadHistory(); else if (tab === 'approval') loadApprovalList();
        }

        function loadDashboard() {
            if (currentUser.role === ROLES.STAFF) {
                const my = leaveRequests.filter(r => r.Name === currentUser.name); 
                $('main-content').innerHTML = `<div class="space-y-8 animate-fade-in"><div class="grid grid-cols-2 md:grid-cols-4 gap-6"><div class="glass-card p-6 rounded-3xl"><p class="text-[10px] font-black uppercase text-slate-400 mb-2">Sisa Annual</p><h3 class="text-3xl font-black text-blue-900">${currentUser.data.AnnualQuota || 0}</h3></div><div class="glass-card p-6 rounded-3xl"><p class="text-[10px] font-black uppercase text-slate-400 mb-2">Sisa Spesial</p><h3 class="text-3xl font-black text-blue-900">${currentUser.data.SpecialQuota || 0}</h3></div></div></div>`;
            } else {
                const pending = leaveRequests.filter(r => (currentUser.role === ROLES.HEAD && r.Status === 'HEAD_DEPT_REVIEW' && r.TargetHeadId.toString() === currentUser.data.ID.toString()) || (currentUser.role === ROLES.HRD && r.Status === 'HRD_APPROVAL'));
                $('main-content').innerHTML = `<div class="glass-card p-8 rounded-[2rem] bg-amber-50 border-amber-100"><h3 class="text-4xl font-black text-amber-700">${pending.length} Menunggu</h3><p class="text-xs uppercase font-bold text-amber-500 mt-1">Antrean Persetujuan Baru</p></div>`;
            }
        }

        function loadHistory() {
            let data = [...leaveRequests]; if (currentUser.role === ROLES.STAFF) data = data.filter(r => r.Name === currentUser.name);
            const grouped = data.reduce((acc, r) => {
                const d = new Date(r.Start); if (isNaN(d.getTime())) return acc;
                const monthYear = d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                if (!acc[monthYear]) acc[monthYear] = []; acc[monthYear].push(r); return acc;
            }, {});
            const sortedKeys = Object.keys(grouped).sort((a, b) => new Date(b.split(' ').reverse().join(' ')) - new Date(a.split(' ').reverse().join(' ')));

            let historyHTML = `<div class="animate-fade-in space-y-8">`;
            sortedKeys.forEach(key => {
                historyHTML += `<div><h4 class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] mb-3">${key}</h4><div class="glass-card rounded-[2rem] overflow-hidden"><table class="w-full text-left"><tbody class="divide-y divide-slate-50">${grouped[key].map(r => `<tr><td class="px-8 py-5"><p class="text-xs font-black">${r.Name}</p></td><td class="px-6 py-5"><p class="text-[10px] font-bold text-blue-600">${r.Type}</p></td><td class="px-6 py-5"><span class="px-3 py-1 rounded-full text-[8px] font-black uppercase ${r.Status === 'APPROVED' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">${r.Status}</span></td><td class="px-8 py-5 text-right">${currentUser.role === ROLES.HRD ? `<button onclick="deleteRequest('${r.ID}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
            });
            $('main-content').innerHTML = historyHTML + `</div>`;
        }

        async function deleteRequest(id) {
            if(!confirm("Hapus riwayat permanen? Kuota akan dikembalikan otomatis.")) return;
            const r = leaveRequests.find(req => req.ID.toString() === id.toString());
            if (r && r.Status === 'APPROVED') {
                const u = users.find(usr => usr.Name === r.Name);
                if (u) {
                    const dur = parseInt(r.Duration) || 0;
                    if (r.Type === 'Annual Leave') u.AnnualQuota = (parseInt(u.AnnualQuota) || 0) + dur;
                    else u.SpecialQuota = (parseInt(u.SpecialQuota) || 0) + dur;
                    u.id = u.ID; await callGAS('saveUser', u);
                }
            }
            await callGAS('deleteRequest', { id: id });
            await fetchFromSheet(); loadHistory();
        }

        function loadApprovalList() {
            const pending = leaveRequests.filter(r => (currentUser.role === ROLES.HEAD && r.Status === 'HEAD_DEPT_REVIEW' && r.TargetHeadId.toString() === currentUser.data.ID.toString()) || (currentUser.role === ROLES.HRD && r.Status === 'HRD_APPROVAL'));
            $('main-content').innerHTML = `<div class="animate-fade-in space-y-6">${pending.map(r => `<div class="glass-card p-6 rounded-3xl flex justify-between items-center"><div><h4 class="font-black text-slate-800">${r.Name}</h4><p class="text-xs font-bold text-blue-600 uppercase">${r.Type}</p></div><div class="flex gap-2"><button onclick="handleApprovalAction('${r.ID}', false)" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl font-bold text-[10px]">Tolak</button><button onclick="handleApprovalAction('${r.ID}', true)" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-black text-[10px]">Setuju</button></div></div>`).join('')}</div>`;
        }

        function handleApprovalAction(id, approve) { pendingApprovalId = id; isApproveAction = approve; $('note-title').innerText = approve ? 'Setujui' : 'Tolak'; $('modal-note').classList.remove('hidden'); $('modal-note').classList.add('flex'); }
        
        async function confirmApprovalWithNote() {
            const note = $('note-text').value.trim(); 
            const r = leaveRequests.find(req => req.ID.toString() === pendingApprovalId.toString()); 
            if (!r) return;
            
            const isHeadDecision = currentUser.role === ROLES.HEAD;
            const isHRDDecision = currentUser.role === ROLES.HRD;
            
            r.Status = isApproveAction ? (isHeadDecision ? 'HRD_APPROVAL' : 'APPROVED') : 'REJECTED';
            if (isHeadDecision) r.HeadNote = note; else r.HRDNote = note;
            
            r.Start = toISODateString(r.Start); r.End = toISODateString(r.End); r.SubmitDate = toISODateString(r.SubmitDate || new Date());
            
            closeNoteModal(); showToast('Memproses...', 'success'); loadApprovalList(); 
            await callGAS('saveRequest', r);
            
            // WHATSAPP NOTIFICATION MECHANISM
            if (isHeadDecision) {
                // 1. Send notification to USER first
                const userMsg = `*UPDATE STATUS CUTI*\n\nYth. ${r.Name},\n\nPengajuan cuti Anda tanggal ${formatDate(r.SubmitDate)} ${isApproveAction ? 'telah *DISETUJUI*' : '*TIDAK DISETUJUI*'} oleh ${currentUser.data.Position}.\n\n*Detail Pengajuan:*\n- Tipe: ${r.Type}\n- Periode: ${formatDate(r.Start)} s/d ${formatDate(r.End)}\n- Durasi: ${r.Duration} Hari\n- Alasan: ${r.Reason}\n\nTerima kasih.`;
                triggerWhatsApp(r.Phone, userMsg);

                // 2. After a short delay, send notification to HRD (only if approved)
                if (isApproveAction) {
                    showToast('Mengirim notifikasi ke HRD...', 'success');
                    setTimeout(() => {
                        const hrdMsg = `*NOTIFIKASI PENGAJUAN CUTI*\n\nYth. HRD Transwisata,\n\nBerikut ini pengajuan cuti dari anggota kami atas nama *${r.Name}* (${r.Position}) telah saya *SETUJUI*\n\n*Detail Pengajuan:*\n- Tipe: ${r.Type}\n- Periode: ${formatDate(r.Start)} s/d ${formatDate(r.End)}\n- Durasi: ${r.Duration} Hari\n- Alasan: ${r.Reason}\n\nMohon diproses lebih lanjut. Terima kasih.`;
                        if (hrdProfile.phone) triggerWhatsApp(hrdProfile.phone, hrdMsg);
                    }, 2000); // 2 second delay to let the user finish/switch back
                }
            } else if (isHRDDecision) {
                const userMsg = `*UPDATE STATUS CUTI*\n\nYth. ${r.Name},\n\nPengajuan cuti Anda tanggal ${formatDate(r.SubmitDate)} ${isApproveAction ? 'telah *DISETUJUI*' : '*TIDAK DISETUJUI*'} oleh HRD Transwisata.\n\nTerima kasih.`;
                if (r.Phone) triggerWhatsApp(r.Phone, userMsg);
            }
            
            if (r.Status === 'APPROVED') {
                const u = users.find(usr => usr.Name === r.Name);
                if (u) {
                    const dur = parseInt(r.Duration) || 0;
                    if (r.Type === 'Annual Leave') u.AnnualQuota = Math.max(0, (parseInt(u.AnnualQuota) || 0) - dur);
                    else u.SpecialQuota = Math.max(0, (parseInt(u.SpecialQuota) || 0) - dur);
                    u.ID = u.ID; await callGAS('saveUser', u);
                }
            }
            await fetchFromSheet(); switchTab('approval');
        }

        function closeNoteModal() { $('note-text').value = ''; $('modal-note').classList.add('hidden'); }
        function closeDetail() { $('modal-detail').classList.add('hidden'); }
        function formatDate(d) { if (!d) return "-"; const date = new Date(d); return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); }
        function showToast(msg, type = 'success') { $('toast-msg').innerText = msg; $('toast').classList.remove('hidden'); setTimeout(() => $('toast').classList.add('hidden'), 3000); }
        
        function triggerWhatsApp(p, m) { 
            if (!p) return;
            let c = String(p).replace(/[^0-9]/g, '');
            if (c.startsWith('0')) c = '62' + c.substring(1); else if (c.startsWith('8')) c = '62' + c;
            window.open(`https://wa.me/${c}?text=${encodeURIComponent(m)}`, '_blank'); 
        }

        window.onload = async () => { $('current-date').innerText = formatDate(new Date()); await fetchFromSheet(); $('global-loader').classList.add('loader-hidden'); };
    </script>
</body>
</html>
